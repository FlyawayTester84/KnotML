run:
  name: ppo-small-cpu
  seed: 0
  device: cpu
  output_dir: runs
  total_timesteps: 60000
  log_every: 1
  checkpoint_every: 0
  keep_checkpoints: 3
  tensorboard: true
  torch_threads: 0
  tf32: true
  compile: false
env:
  calculus: 4-manifold
  closed: false
  max_crossings: 32
  max_components: 6
  max_steps: 40
  max_actions: 512
  num_envs: 8
  vectorization: async
  scramble:
  - 1
  - 3
reward:
  name: potential
  kwargs:
    solved: 1.0
    step: -0.01
    illegal: -0.1
    component_weight: 0.1
    crossing_weight: 0.01
curriculum:
  enabled: true
  window: 100
  promote_at: 0.8
  step: 1
  max_scramble: 12
eval:
  every: 10
  episodes: 32
  num_envs: 8
  deterministic: true
  scramble: null
policy:
  name: gnn
  hidden: 64
  layers: 3
  framing_clip: 8
  factorization: flat
algorithm:
  name: ppo
  learning_rate: 0.0003
  anneal_lr: true
  num_steps: 64
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 4
  update_epochs: 4
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
  adam_eps: 1.0e-05
  weight_decay: 0.0
