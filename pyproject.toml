[project]
name = "knotml"
version = "0.1.0"
description = "Machine learning and reinforcement learning on knot diagrams."
authors = [
  { name = "Runze Yu", email = "ryu@math.harvard.edu" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.26",
  "gymnasium>=1.4",
]

[project.optional-dependencies]
# Certificates, invariants and data: knot Floer homology, Jones polynomial, KnotInfo tables.
oracles = [
  "snappy>=3.2",
  "regina>=7.4",
  "knot_floer_homology",
  "database_knotinfo",
]
# Training agents (knotml.rl, scripts/train_agent.py). Add tensorboard for TensorBoard logs.
rl = [
  "torch>=2.2",
  "pyyaml>=6.0",
]
dev = [
  "pytest",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
