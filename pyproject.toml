[project]
name = "unknot_rl"
version = "0.1.0"
description = "Reinforcement learning framework for unknotting knots."
authors = [
  { name = "Runze Yu", email = "ryu@math.harvard.edu" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.26",
  "gymnasium>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
